services:
  xrp-monitor:
    build:
      context: .
      target: production
    container_name: xrp-tracker
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - xrp-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  xrp-data:
    driver: local
