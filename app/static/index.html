<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP Monitor - Professional Dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1>XRP Monitor</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="refreshBtn" title="Refresh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 4V10H7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M23 20V14H17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14L18.36 18.36A9 9 0 0 1 3.51 15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="themeToggle" title="Toggle Theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card balance-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10" stroke-width="2"/>
                        <path d="M12 6V12L16 14" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">Total Balance</p>
                    <h2 class="stat-value" id="totalBalance">0</h2>
                    <p class="stat-unit">XRP</p>
                </div>
            </div>

            <div class="stat-card inflow-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 5V19M5 12L12 5L19 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">24h Inflow</p>
                    <h2 class="stat-value" id="inflow24h">0</h2>
                    <p class="stat-unit">XRP</p>
                </div>
            </div>

            <div class="stat-card outflow-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 19V5M5 12L12 19L19 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">24h Outflow</p>
                    <h2 class="stat-value" id="outflow24h">0</h2>
                    <p class="stat-unit">XRP</p>
                </div>
            </div>

            <div class="stat-card alerts-card">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="9" x2="12" y2="13" stroke-width="2" stroke-linecap="round"/>
                        <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <p class="stat-label">Active Alerts</p>
                    <h2 class="stat-value" id="alertCount">0</h2>
                    <p class="stat-unit">alerts</p>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="card chart-card">
            <div class="card-header">
                <h3>Net Flow Trend</h3>
                <div class="chart-legend">
                    <span class="legend-item">
                        <span class="legend-color" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></span>
                        Balance Change
                    </span>
                </div>
            </div>
            <div class="card-body">
                <canvas id="flowChart"></canvas>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="content-grid">
            <!-- Transactions Table -->
            <div class="card transactions-card">
                <div class="card-header">
                    <h3>Recent Transactions</h3>
                    <button class="btn-primary btn-sm" id="viewAllTransactions">View All</button>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Direction</th>
                                    <th>Amount (XRP)</th>
                                    <th>Counterparty</th>
                                    <th>Hash</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTable">
                                <tr class="loading-row">
                                    <td colspan="5">
                                        <div class="loading-spinner"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Alerts Panel -->
            <div class="card alerts-panel">
                <div class="card-header">
                    <h3>Alert Center</h3>
                    <button class="btn-primary btn-sm" id="createAlertBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="12" y1="5" x2="12" y2="19" stroke-width="2" stroke-linecap="round"/>
                            <line x1="5" y1="12" x2="19" y2="12" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        New Alert
                    </button>
                </div>
                <div class="card-body">
                    <div id="alertsList" class="alerts-list">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Creating Alert -->
    <div id="alertModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Alert Rule</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="alertForm">
                    <div class="form-group">
                        <label for="alertName">Alert Name</label>
                        <input type="text" id="alertName" name="name" required placeholder="e.g., Large Transaction Alert">
                    </div>
                    <div class="form-group">
                        <label for="minAmount">Minimum Amount (XRP)</label>
                        <input type="number" id="minAmount" name="min_amount_xrp" step="0.01" placeholder="e.g., 100">
                    </div>
                    <div class="form-group">
                        <label for="direction">Direction</label>
                        <select id="direction" name="direction">
                            <option value="">Any</option>
                            <option value="inbound">Inbound</option>
                            <option value="outbound">Outbound</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="counterparty">Counterparty Address</label>
                        <input type="text" id="counterparty" name="counterparty" placeholder="e.g., rXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label for="memoKeyword">Memo Keyword</label>
                        <input type="text" id="memoKeyword" name="memo_keyword" placeholder="e.g., payment">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelAlert">Cancel</button>
                        <button type="submit" class="btn-primary">Create Alert</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
